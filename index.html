<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>ody.monster</title>
<style>
:root{--red:#d32222;--dark:#030000;--text:#f4eaea}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020000;color:var(--text);font-family:Georgia,"Times New Roman",serif}body{display:grid;place-items:center;position:relative;isolation:isolate;background:radial-gradient(circle at 50% 52%,rgba(130,0,0,.32),rgba(30,0,0,.25) 32%,#020000 75%)}
.haze{position:fixed;inset:-25%;z-index:-10;pointer-events:none;background:conic-gradient(from 0deg,transparent,rgba(180,0,0,.12),transparent,rgba(255,0,0,.07),transparent);filter:blur(60px);animation:haze 8s ease-in-out infinite alternate}@keyframes haze{to{transform:scale(1.15) rotate(6deg);opacity:.7}}
.vignette{position:fixed;inset:0;z-index:60;pointer-events:none;box-shadow:inset 0 0 120px 55px rgba(0,0,0,.92),inset 0 0 260px 95px rgba(90,0,0,.18)}
.pulse{position:fixed;inset:0;z-index:35;pointer-events:none;mix-blend-mode:screen;animation:pulse 5s ease-in-out infinite}@keyframes pulse{0%,100%{background:rgba(170,0,0,0)}48%{background:rgba(170,0,0,.02)}52%{background:rgba(255,0,0,.10)}58%{background:rgba(120,0,0,.015)}}
.apparition{position:fixed;width:min(25vw,340px);opacity:0;pointer-events:none;z-index:-2;mix-blend-mode:screen;filter:grayscale(1) sepia(.8) hue-rotate(305deg) saturate(4) contrast(1.5) brightness(.7) drop-shadow(0 0 25px rgba(255,0,0,.22))}.a1{left:-2vw;top:6vh;animation:a1 11s ease-in-out infinite}.a2{right:-2vw;top:7vh;animation:a2 13s ease-in-out 2s infinite}.a3{left:4vw;bottom:-3vh;animation:a1 15s ease-in-out 4s infinite}.a4{right:4vw;bottom:-5vh;animation:a2 12s ease-in-out 6s infinite}.a5{left:50%;top:-8vh;width:min(19vw,250px);animation:a5 16s ease-in-out 7s infinite}@keyframes a1{0%,18%,55%,100%{opacity:0;transform:scale(.9) rotate(-6deg)}25%{opacity:.1}31%{opacity:.34;transform:scale(1.06) rotate(-1deg)}39%{opacity:.05}46%{opacity:.22}}@keyframes a2{0%,22%,63%,100%{opacity:0;transform:scale(.88) rotate(7deg)}30%{opacity:.12}38%{opacity:.31;transform:scale(1.05) rotate(1deg)}47%{opacity:.06}54%{opacity:.22}}@keyframes a5{0%,30%,74%,100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(.9)}39%{opacity:.12}48%{opacity:.27;transform:translateX(-50%) translateY(8px) scale(1.05)}58%{opacity:.04}67%{opacity:.18}}
.site{position:relative;z-index:5;width:min(1050px,96vw);text-align:center}.tag{font-size:.72rem;letter-spacing:.42em;text-transform:uppercase;color:#a76a6a;margin-bottom:12px;text-shadow:0 0 10px rgba(255,0,0,.35)}h1{max-width:900px;margin:0 auto 8px;font-size:clamp(2rem,5vw,5rem);line-height:.98;letter-spacing:-.045em;text-shadow:0 0 13px rgba(255,0,0,.28),0 0 40px rgba(120,0,0,.16);animation:breathe 5s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.008);filter:brightness(1.09)}}
.altar{position:relative;width:min(600px,78vh,90vw);aspect-ratio:1;margin:0 auto;display:grid;place-items:center}.altar:before{content:"";position:absolute;inset:15%;border-radius:50%;background:radial-gradient(circle,rgba(220,0,0,.20),rgba(90,0,0,.06) 46%,transparent 70%);filter:blur(18px);animation:core 4.5s ease-in-out infinite}@keyframes core{50%{transform:scale(1.18);opacity:.65}}
.monster{position:relative;z-index:20;width:31%;max-height:410px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(255,255,255,.2)) drop-shadow(0 0 32px rgba(255,0,0,.5)) drop-shadow(0 0 70px rgba(100,0,0,.3));animation:float 4.4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-8px) scale(1.025)}}
.ring{position:absolute;left:50%;top:50%;translate:-50% -50%;border-radius:50%;pointer-events:none}.ring svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 0 7px rgba(255,0,0,.5))}.ring text{fill:#df3535;font-size:17px;letter-spacing:5px}.ring circle,.ring polygon{stroke:#c52828;fill:none}.r1{width:100%;height:100%;opacity:.88;animation:spin 24s linear infinite}.r2{width:80%;height:80%;opacity:.66;animation:spinrev 16s linear infinite}.r3{width:62%;height:62%;opacity:.55;animation:spin 10s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@keyframes spinrev{to{transform:rotate(-360deg)}}
.orbit{position:absolute;inset:0;z-index:15;animation:spinrev 13s linear infinite}.rune{position:absolute;left:50%;top:50%;font-size:clamp(18px,2.2vw,30px);color:#ef4444;text-shadow:0 0 8px rgba(255,0,0,.95),0 0 22px rgba(255,0,0,.5);opacity:.75}.rune:nth-child(1){transform:translate(-50%,-50%) rotate(0deg) translateY(-245px)}.rune:nth-child(2){transform:translate(-50%,-50%) rotate(60deg) translateY(-245px)}.rune:nth-child(3){transform:translate(-50%,-50%) rotate(120deg) translateY(-245px)}.rune:nth-child(4){transform:translate(-50%,-50%) rotate(180deg) translateY(-245px)}.rune:nth-child(5){transform:translate(-50%,-50%) rotate(240deg) translateY(-245px)}.rune:nth-child(6){transform:translate(-50%,-50%) rotate(300deg) translateY(-245px)}
.countdown{position:fixed;inset:0;z-index:100;display:grid;place-items:center;pointer-events:none;transition:opacity .5s ease}.countdown.hide{opacity:0}.num{font-family:Arial,Helvetica,sans-serif;font-weight:900;font-size:clamp(7rem,25vw,19rem);color:#f5eaea;text-shadow:0 0 20px rgba(255,255,255,.12),0 0 50px rgba(255,0,0,.75),0 0 140px rgba(130,0,0,.7);animation:beat .72s ease both}@keyframes beat{from{transform:scale(.58);opacity:0;filter:blur(9px)}35%{opacity:.92}to{transform:scale(1.08);opacity:.2;filter:blur(0)}}
.player{position:fixed;left:50%;bottom:13px;transform:translateX(-50%);z-index:120;display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:11px;background:rgba(8,0,0,.82);border:1px solid rgba(255,70,70,.17);backdrop-filter:blur(10px);box-shadow:0 0 18px rgba(255,0,0,.13);opacity:.82}.player:hover{opacity:1}.player button{border:0;background:transparent;color:#eee;cursor:pointer;padding:4px 6px;border-radius:6px;font-size:.9rem}.player button:hover{background:rgba(255,255,255,.07)}.player input{width:76px;accent-color:#c92e2e}.status{font:600 10px/1 Arial,sans-serif;letter-spacing:.07em;color:#9e7474;min-width:48px;text-align:right}
.grain{position:fixed;inset:0;z-index:45;pointer-events:none;opacity:.04;background-image:repeating-radial-gradient(circle at 20% 40%,#fff 0 1px,transparent 1px 3px);background-size:7px 7px;mix-blend-mode:overlay;animation:grain .4s steps(2) infinite}@keyframes grain{25%{transform:translate(1px,-1px)}50%{transform:translate(-1px,1px)}75%{transform:translate(1px,1px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}.apparition{opacity:.12}}@media(max-width:700px){h1{font-size:clamp(1.7rem,8vw,3rem)}.altar{width:min(92vw,500px)}.rune:nth-child(n){font-size:20px}.rune:nth-child(1){transform:translate(-50%,-50%) rotate(0deg) translateY(-190px)}.rune:nth-child(2){transform:translate(-50%,-50%) rotate(60deg) translateY(-190px)}.rune:nth-child(3){transform:translate(-50%,-50%) rotate(120deg) translateY(-190px)}.rune:nth-child(4){transform:translate(-50%,-50%) rotate(180deg) translateY(-190px)}.rune:nth-child(5){transform:translate(-50%,-50%) rotate(240deg) translateY(-190px)}.rune:nth-child(6){transform:translate(-50%,-50%) rotate(300deg) translateY(-190px)}}
</style>
</head>
<body>
<div class="haze"></div>

<!-- Your own images. Transparent PNG/WebP works best. -->
<img class="apparition a1" src="occult-1.jfif" alt="">
<img class="apparition a2" src="occult-2.jpg" alt="">
<img class="apparition a3" src="occult-3.jpeg" alt="">
<img class="apparition a4" src="occult-4.jpg" alt="">
<img class="apparition a5" src="occult-5.jpg" alt="">

<main class="site">
  <div class="tag">ody.monster</div>
  <h1>This site isn’t the only monster associated with Ody ;)</h1>

  <section class="altar">
    <div class="ring r1"><svg viewBox="0 0 600 600"><defs><path id="p1" d="M300,300 m-265,0 a265,265 0 1,1 530,0 a265,265 0 1,1 -530,0"/></defs><circle cx="300" cy="300" r="265" stroke-width="1.3"/><circle cx="300" cy="300" r="238" stroke-width=".7" opacity=".55"/><text><textPath href="#p1">⛧ ☽ ☿ ♄ ✶ ⛥ ☉ ☾ ✦ ⛧ ☽ ☿ ♄ ✶ ⛥ ☉ ☾ ✦</textPath></text></svg></div>
    <div class="ring r2"><svg viewBox="0 0 600 600"><defs><path id="p2" d="M300,300 m-215,0 a215,215 0 1,1 430,0 a215,215 0 1,1 -430,0"/></defs><circle cx="300" cy="300" r="215" stroke-width="1.1"/><polygon points="300,78 431,481 88,232 512,232 169,481" stroke-width="1.1" opacity=".68"/><text><textPath href="#p2">✦ ⛧ ☉ ☿ ☽ ✶ ♄ ⛥ ☾ ✦ ⛧ ☉ ☿ ☽ ✶</textPath></text></svg></div>
    <div class="ring r3"><svg viewBox="0 0 600 600"><defs><path id="p3" d="M300,300 m-160,0 a160,160 0 1,1 320,0 a160,160 0 1,1 -320,0"/></defs><circle cx="300" cy="300" r="160" stroke-width="1"/><circle cx="300" cy="300" r="125" stroke-width=".7" opacity=".6"/><text><textPath href="#p3">☽ ⛧ ♄ ✶ ☿ ☉ ⛥ ☾ ☽ ⛧ ♄ ✶ ☿ ☉</textPath></text></svg></div>
    <div class="orbit"><span class="rune">⛧</span><span class="rune">☿</span><span class="rune">☽</span><span class="rune">♄</span><span class="rune">⛥</span><span class="rune">☉</span></div>
    <img class="monster" src="monster-white.png" alt="White Monster can">
  </section>
</main>

<div id="countdown" class="countdown"><div id="num" class="num">3</div></div>

<div class="player">
  <button id="play" title="Play / pause">▶</button>
  <button id="mute" title="Mute / unmute">🔊</button>
  <input id="vol" type="range" min="0" max="100" value="12" title="Volume">
  <span id="status" class="status">READY</span>
</div>

<audio id="music" loop preload="auto"><source src="happy-nation.mp3" type="audio/mpeg"></audio>
<div class="pulse"></div><div class="grain"></div><div class="vignette"></div>

<script>
const music=document.getElementById('music'),play=document.getElementById('play'),mute=document.getElementById('mute'),vol=document.getElementById('vol'),status=document.getElementById('status'),countdown=document.getElementById('countdown');
let num=document.getElementById('num');music.volume=Number(vol.value)/100;music.muted=false;
function controls(){play.textContent=music.paused?'▶':'❚❚';mute.textContent=(music.muted||music.volume===0)?'🔇':'🔊'}
function show(n){const fresh=num.cloneNode(true);fresh.textContent=n;num.replaceWith(fresh);num=fresh}
async function start(){for(const n of ['3','2','1']){show(n);await new Promise(r=>setTimeout(r,760))}countdown.classList.add('hide');setTimeout(()=>countdown.style.display='none',520);try{await music.play();status.textContent='PLAYING'}catch(e){status.textContent='CLICK ▶';const unlock=async()=>{try{await music.play();status.textContent='PLAYING';controls()}catch(_){}window.removeEventListener('pointerdown',unlock);window.removeEventListener('keydown',unlock)};window.addEventListener('pointerdown',unlock);window.addEventListener('keydown',unlock)}controls()}
play.onclick=async()=>{if(music.paused){try{await music.play();status.textContent='PLAYING'}catch(e){status.textContent='BLOCKED'}}else{music.pause();status.textContent='PAUSED'}controls()};mute.onclick=()=>{music.muted=!music.muted;controls()};vol.oninput=()=>{music.volume=Number(vol.value)/100;if(music.volume===0)music.muted=true;else if(music.muted)music.muted=false;controls()};controls();start();
</script>
</body>
